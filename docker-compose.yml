version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:11451
    depends_on:
      - backend
    networks:
      - webshellguard

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "11451:11451"
    volumes:
      - ./backend/model:/app/model
      - ./backend/uploads:/app/uploads
      - ./backend/avatars:/app/avatars
    environment:
      - FLASK_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=webshell
      - DB_PASSWORD=webshell123
      - DB_NAME=webshellguard
    depends_on:
      - mysql
    networks:
      - webshellguard

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=webshellguard
      - MYSQL_USER=webshell
      - MYSQL_PASSWORD=webshell123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webshellguard

networks:
  webshellguard:
    driver: bridge

volumes:
  mysql_data: